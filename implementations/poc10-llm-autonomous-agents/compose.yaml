services:
  alice:
    build: .
    command: ["-node", "alice", "-config", "/app/config.json"]
    environment:
      - OPENAI_API_KEY
    networks: [poc10]
    volumes:
      - ./config.json:/app/config.json:ro
      - poc10-run:/run/poc10
  bob:
    build: .
    command: ["-node", "bob", "-config", "/app/config.json"]
