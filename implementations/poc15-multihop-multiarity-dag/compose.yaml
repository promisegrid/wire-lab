services:
  event-collector:
    build: .
    entrypoint: ["/usr/local/bin/poc15-event-collector"]
    command: ["-config", "/app/config.json"]
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [openai_api_key]
    networks: [poc15]
    volumes:
      - ./config.json:/app/config.json:ro
      - poc15-observer-run:/run/poc15

  alice:
    build: .
    command: ["-container", "alice", "-config", "/app/config.json"]
    depends_on: [event-collector]
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [openai_api_key]
    networks: [poc15]
    volumes:
      - ./config.json:/app/config.json:ro
  bob:
