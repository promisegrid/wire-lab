services:
  alice:
    build: .
    command: ["-container", "alice", "-config", "/app/config.json"]
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [openai_api_key]
    networks: [poc11]
    volumes:
      - ./config.json:/app/config.json:ro
      - poc11-run:/run/poc11
