services:
  alice:
    build: .
    command: ["/usr/local/bin/run-alice.sh"]
    networks: [poc5]
    volumes: [poc5-run:/run/poc5]
    environment:
      POC5_RUN_ID: ${POC5_RUN_ID:-manual}
