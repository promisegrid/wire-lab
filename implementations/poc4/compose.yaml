      POC4_RUN_ID: ${POC4_RUN_ID:-manual}
  dave:
    build: .
    command: ["/usr/local/bin/run-dave.sh"]
    networks: [poc4]
    volumes: [poc4-run:/run/poc4]
    environment:
      POC4_RUN_ID: ${POC4_RUN_ID:-manual}
  ellen:
    build: .
