services:
  alice:
    build: .
    command: ["/usr/local/bin/run-alice.sh"]
    networks: [poc4]
    volumes: [poc4-run:/run/poc4]
    environment:
      POC4_RUN_ID: ${POC4_RUN_ID:-manual}
